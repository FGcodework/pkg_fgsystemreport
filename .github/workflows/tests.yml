name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax check
        run: find com_fgsystemreport pkg_fgsystemreport plg_* tests -name '*.php' -not -path '*/TCPDF/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Run tests
        run: php tests/run.php
